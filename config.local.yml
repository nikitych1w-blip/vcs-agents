# Локальное окружение — Claude через auth2api, локальный vault
# Генерация: make generate-local

default_model: claude-sonnet

# ─── Модели ──────────────────────────────────────────────────────────────────
models:
  company-main:
    display: Qwen3 Coder Next
    provider: sbt
    upstream: openai/Qwen/Qwen3-Coder-Next

  company-large:
    display: "Qwen3.5 397B"
    provider: sbt
    upstream: openai/Qwen/Qwen3.5-397B-A17B

  gigachat-max:
    display: GigaChat-2-Max
    provider: sbt
    upstream: openai/GigaChat-2-Max

  claude-sonnet:
    display: Claude Sonnet 4.6
    provider: auth2api
    upstream: openai/claude-sonnet-4-6

  claude-opus:
    display: Claude Opus 4.7
    provider: auth2api
    upstream: openai/claude-opus-4-7

# ─── Провайдеры ──────────────────────────────────────────────────────────────
providers:
  sbt:
    api_base_env: SBT_API_BASE_URL
    api_key_env: AI_HUB_SBT_KEY

  auth2api:
    api_base_env: AUTH2API_BASE_URL
    api_key: auth2api-internal-key

# ─── MCP ─────────────────────────────────────────────────────────────────────
mcp:
  vault:
    url_env: VAULT_LOCAL_MCP_URL
    opencode_url_env: VAULT_EXTERNAL_MCP_URL
    transport: http
    auth_type: none
  sc_local:
    url_env: SC_LOCAL_MCP_URL
    opencode_url_env: SC_LOCAL_EXTERNAL_MCP_URL
    transport: http
    auth_type: none

# ─── LiteLLM gateway ─────────────────────────────────────────────────────────
litellm:
  router:
    num_retries: 2
  settings:
    drop_params: true
    ssl_verify: false
  general:
    master_key_env: LITELLM_MASTER_KEY
    salt_key_env: LITELLM_SALT_KEY
    database_url_env: DATABASE_URL
    store_model_in_db: true
  observability:
    langfuse:
      public_key_env: LANGFUSE_PUBLIC_KEY
      secret_key_env: LANGFUSE_SECRET_KEY
      host_env: LANGFUSE_HOST

# ─── OpenCode ────────────────────────────────────────────────────────────────
opencode:
  litellm_base_url_env: LITELLM_BASE_URL
  litellm_api_key_env: LITELLM_API_KEY
  litellm_mcp_url_env: LITELLM_MCP_URL

# ─── auth2api (OAuth прокси) ─────────────────────────────────────────────────
# Три режима:
#   claude  — entrypoint: cli    → make auth2api-login         (по умолчанию)
#   codex   — entrypoint: codex  → make auth2api-login-codex
#   none    — удали всю эту секцию и запускай через make up-local-bare
auth2api:
  port: 8317
  api_key: auth2api-internal-key
  timeouts:
    messages_ms: 120000
    stream_messages_ms: 600000
    count_tokens_ms: 30000
  cloaking:
    cli_version: "2.1.153"
    entrypoint: cli   # ← сменить на: codex

# ─── Worker ──────────────────────────────────────────────────────────────────
worker:
  temporal_namespace: default
  vault_mcp_url_env: VAULT_LOCAL_MCP_URL
  sc_local_mcp_url_env: SC_LOCAL_MCP_URL
  # Secrets/env passed via .env.local — documented here for discoverability
  temporal_address_env: TEMPORAL_ADDRESS
  litellm_base_url_env: WORKER_LITELLM_BASE_URL
  litellm_api_key_env: LITELLM_MASTER_KEY
  sc_base_url_env: SC_BASE_URL
  sc_token_env: SC_TOKEN
  otel_endpoint_env: OTEL_EXPORTER_OTLP_ENDPOINT
