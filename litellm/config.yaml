model_list:
  - model_name: company-main
    litellm_params:
      model: openai/Qwen/Qwen3-Coder-Next
      api_base: https://api.ai.sbt/openai/v1
      api_key: os.environ/AI_HUB_SBT_KEY

  - model_name: company-large
    litellm_params:
      model: openai/Qwen/Qwen3.5-397B-A17B
      api_base: https://api.ai.sbt/openai/v1
      api_key: os.environ/AI_HUB_SBT_KEY

  - model_name: gigachat-max
    litellm_params:
      model: openai/GigaChat-2-Max
      api_base: https://api.ai.sbt/openai/v1
      api_key: os.environ/AI_HUB_SBT_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: http://auth2api:8317/v1
      api_key: auth2api-internal-key

  - model_name: claude-opus
    litellm_params:
      model: openai/claude-opus-4-7
      api_base: http://auth2api:8317/v1
      api_key: auth2api-internal-key

mcp_servers:
  vault_mcp:
    url: "http://vault-mcp:8080/mcp"
    transport: http
    auth_type: none

router_settings:
  num_retries: 2

litellm_settings:
  drop_params: true
  ssl_verify: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true