services:
  temporal:
    image: temporalio/temporal:latest
    user: root
    command: server start-dev --ip 0.0.0.0 --db-filename /temporal-data/temporal.db --log-level warn
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/temporal-data
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "list", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  litellm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yml"]
    ports:
      - "4000:4000"
    environment:
      # ── LiteLLM core ────────────────────────────────────────────
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      PYTHONHTTPSVERIFY: "0"
      # ── SBT AI Hub ──────────────────────────────────────────────
      SBT_API_BASE_URL: ${SBT_API_BASE_URL}
      AI_HUB_SBT_KEY: ${AI_HUB_SBT_KEY}
      # ── auth2api (local only, пустая строка в prod) ─────────────
      AUTH2API_BASE_URL: ${AUTH2API_BASE_URL:-}
      # ── Vault MCP ───────────────────────────────────────────────
      VAULT_LOCAL_MCP_URL: ${VAULT_LOCAL_MCP_URL:-}
      VAULT_MCP_URL: ${VAULT_MCP_URL:-}
      VAULT_MCP_TOKEN: ${VAULT_MCP_TOKEN:-}
      # ── Observability ───────────────────────────────────────────
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    volumes:
      - ../configs/litellm/config.generated.yaml:/app/config.yml:ro
    depends_on:
      litellm-db:
        condition: service_healthy
      vault-mcp:
        condition: service_healthy
      auth2api:
        condition: service_healthy
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth2api:
    build:
      context: ../auth2api
      dockerfile: Dockerfile
    volumes:
      - auth2api-data:/data
      - ../configs/auth2api/config.generated.yaml:/config/config.yaml:ro
    networks: [pipeline-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8317/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  temporal-data:
  litellm-db-data:
  auth2api-data:

networks:
  pipeline-net:
    name: pipeline-net
